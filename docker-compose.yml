services:
  toolnest:
    build: .
    container_name: toolnest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:3000"
    volumes:
      - toolnest-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  toolnest-data:
    driver: local
